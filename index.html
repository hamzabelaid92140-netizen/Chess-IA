<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            font-family: 'VT323', monospace;
            background-color: #050508;
            color: #00FF66;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 1000;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            10% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            20% { transform: translate(-2px, -2px) }
            40% { transform: translate(3px, 2px); filter: hue-rotate(-90deg); }
            60% { transform: translate(-2px, -2px) }
            80% { transform: translate(2px, -3px) }
            100% { transform: translate(0); filter: none; }
        }

        .glitch-anim {
            animation: glitch 0.15s infinite;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            background: #0d0d14;
            padding: 20px;
            border: 2px solid #00AA44;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
            z-index: 10;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #info-panel {
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #FFFF55;
            text-shadow: 1px 1px #000000;
            text-align: center;
            letter-spacing: 1px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 75px);
            grid-template-rows: repeat(8, 75px);
            border: 3px solid #00AA44;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            background-color: #0b0b0f;
        }

        .square {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .light { background-color: #3b7a57; color: #FFFFFF; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .dark { background-color: #1b4332; color: #111111; text-shadow: 0 0 8px rgba(0,0,0,0.9); }
        .selected { background-color: #FFE600 !important; color: #000000 !important; }

        /* Style spécifique pour dissocier clairement les couleurs des camps */
        .piece-white { color: #FFFFFF !important; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .piece-green { color: #00FF66 !important; text-shadow: 0 0 10px rgba(0,255,102,0.9); }

        .chat-container {
            width: 320px;
            height: 608px;
            display: flex;
            flex-direction: column;
            background: #08080c;
            border: 2px solid #00AA44;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,170,68,0.15);
            overflow: hidden;
        }

        .chat-header {
            background: #00AA44;
            color: #050505;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 16px;
        }

        .message {
            padding: 6px 10px;
            border-radius: 4px;
            max-width: 90%;
            word-break: break-word;
        }

        .message.user {
            background: #1b4d3e;
            color: #ffffff;
            align-self: flex-end;
            box-shadow: 1px 1px 0px #00AA44;
        }

        .message.ai {
            background: #12121c;
            color: #00FF66;
            align-self: flex-start;
            border-left: 3px solid #00AA44;
        }

        .chat-inputs {
            padding: 8px;
            background: #0a0a10;
            border-top: 2px solid #00AA44;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .dialog-btn {
            background: #14141e;
            color: #00FF66;
            border: 1px solid #00AA44;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-family: 'VT323', monospace;
            font-size: 15px;
            transition: all 0.1s;
        }

        .dialog-btn:hover {
            background: #00AA44;
            color: #050505;
            box-shadow: 0 0 8px #00AA44;
        }

        #knife-canvas {
            display: none;
            background: #020204;
            border: 3px solid #00AA44;
            box-shadow: 0 0 25px rgba(0, 170, 68, 0.6);
        }
    </style>
</head>
<body>

<div class="main-container" id="mainContainer">
    <div class="game-area">
        <div id="info-panel">STATUT : TOUR DES BLANCS</div>
        <div id="board"></div>
        <canvas id="knife-canvas" width="600" height="600"></canvas>
    </div>

    <div class="chat-container">
        <div class="chat-header">TERMINAL</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Salut ! Tu passes une bonne journée ? (Progression du protocole : 0/50 dialogues)</div>
        </div>
        <div class="chat-inputs" id="dialogButtonsContainer"></div>
    </div>
</div>

<script>
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startAmbientDrone();
        }
    }

    function startAmbientDrone() {
        if (!audioCtx) return;
        const osc1 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(42, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime);

        osc1.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start();
    }

    function playMoveSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function playMessageSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    const piecesSymbols = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let boardState = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
    ];

    let turn = 'white';
    let selectedSquare = null;
    let gameEnded = false;
    let dialogCount = 0; // Compteur exact de dialogues requis (50)
    let knifeModeActive = false;

    const boardElement = document.getElementById('board');
    const infoPanel = document.getElementById('info-panel');

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                
                const piece = boardState[r][c];
                if (piece) {
                    const span = document.createElement('span');
                    span.innerText = piecesSymbols[piece] || piece;
                    // Application stricte des couleurs : Joueur = Blanc, IA = Vert
                    if (isWhitePiece(piece)) {
                        span.className = 'piece-white';
                    } else if (isBlackPiece(piece)) {
                        span.className = 'piece-green';
                    }
                    sq.appendChild(span);
                }

                if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
                    sq.classList.add('selected');
                }

                sq.addEventListener('click', () => {
                    initAudio();
                    handleSquareClick(r, c);
                });
                boardElement.appendChild(sq);
            }
        }
    }

    function isWhitePiece(p) {
        return p && p === p.toUpperCase();
    }

    function isBlackPiece(p) {
        return p && p === p.toLowerCase();
    }

    function isPathClear(sr, sc, tr, tc) {
        let rStep = Math.sign(tr - sr);
        let cStep = Math.sign(tc - sc);
        let currR = sr + rStep;
        let currC = sc + cStep;

        while (currR !== tr || currC !== tc) {
            if (boardState[currR][currC] !== '') {
                return false;
            }
            currR += rStep;
            currC += cStep;
        }
        return true;
    }

    function isValidMove(sr, sc, tr, tc, board = boardState) {
        const piece = board[sr][sc];
        const target = board[tr][tc];

        if (!piece) return false;
        if (sr === tr && sc === tc) return false;

        if (isWhitePiece(piece) && isWhitePiece(target)) return false;
        if (isBlackPiece(piece) && isBlackPiece(target)) return false;

        const pLower = piece.toLowerCase();
        let dr = tr - sr;
        let dc = tc - sc;
        let absDr = Math.abs(dr);
        let absDc = Math.abs(dc);

        switch (pLower) {
            case 'p':
                let direction = isWhitePiece(piece) ? -1 : 1;
                let startRow = isWhitePiece(piece) ? 6 : 1;

                if (dc === 0 && dr === direction && target === '') return true;
                if (dc === 0 && dr === 2 * direction && sr === startRow && target === '' && board[sr + direction][sc] === '') return true;
                if (absDc === 1 && dr === direction && target !== '' && ((isWhitePiece(piece) && isBlackPiece(target)) || (isBlackPiece(piece) && isWhitePiece(target)))) return true;
                return false;

            case 'r':
                if (sr === tr || sc === tc) return isPathClear(sr, sc, tr, tc);
                return false;

            case 'n':
                if ((absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2)) return true;
                return false;

            case 'b':
                if (absDr === absDc) return isPathClear(sr, sc, tr, tc);
                return false;

            case 'q':
                if (sr === tr || sc === tc || absDr === absDc) return isPathClear(sr, sc, tr, tc);
                return false;

            case 'k':
                if (absDr <= 1 && absDc <= 1) return true;
                return false;

            default:
                return false;
        }
    }

    function handleSquareClick(r, c) {
        if (gameEnded || turn !== 'white' || knifeModeActive) return;
        const piece = boardState[r][c];
        
        if (selectedSquare) {
            if (isValidMove(selectedSquare.row, selectedSquare.col, r, c)) {
                playMoveSound();
                boardState[r][c] = boardState[selectedSquare.row][selectedSquare.col];
                boardState[selectedSquare.row][selectedSquare.col] = '';
                selectedSquare = null;
                renderBoard();
                checkGameEndCondition();
                
                if (!gameEnded) {
                    turn = 'black';
                    infoPanel.innerText = "STATUT : RÉFLEXION DE L'IA...";
                    setTimeout(aiSmartMove, 600);
                }
            } else {
                if (isWhitePiece(piece)) {
                    selectedSquare = { row: r, col: c };
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        } else {
            if (isWhitePiece(piece)) {
                playMoveSound();
                selectedSquare = { row: r, col: c };
                renderBoard();
            }
        }
    }

    function aiSmartMove() {
        if (gameEnded || knifeModeActive) return;
        let allMoves = [];
        const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (isBlackPiece(boardState[r][c])) {
                    for (let tr = 0; tr < 8; tr++) {
                        for (let tc = 0; tc < 8; tc++) {
                            if (isValidMove(r, c, tr, tc)) {
                                let score = 0;
                                let target = boardState[tr][tc];
                                if (isWhitePiece(target)) {
                                    score += pieceValues[target.toLowerCase()] * 10;
                                    if (target === 'K') score += 5000;
                                }
                                if (boardState[r][c] === 'p') {
                                    score += tr; 
                                }
                                allMoves.push({ sr: r, sc: c, tr: tr, tc: tc, score: score + Math.random() });
                            }
                        }
                    }
                }
            }
        }

        if (allMoves.length > 0) {
            allMoves.sort((a, b) => b.score - a.score);
            let bestMove = allMoves[0];
            playMoveSound();
            boardState[bestMove.tr][bestMove.tc] = boardState[bestMove.sr][bestMove.sc];
            boardState[bestMove.sr][bestMove.sc] = '';
        }

        renderBoard();
        checkGameEndCondition();
        if (!gameEnded) {
            turn = 'white';
            infoPanel.innerText = "STATUT : TOUR DES BLANCS";
        }
    }

    function checkGameEndCondition() {
        let whiteKing = false, blackKing = false;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (boardState[r][c] === 'K') whiteKing = true;
                if (boardState[r][c] === 'k') blackKing = true;
            }
        }
        if (!whiteKing) {
            gameEnded = true;
            infoPanel.innerText = ">> ÉCHEC ET MAT : L'IA A GAGNÉ <<";
            appendMessage("Dommage, j'ai gagné la partie !", 'ai');
        } else if (!blackKing) {
            gameEnded = true;
            infoPanel.innerText = ">> VICTOIRE : ROI VERT ABATTU <<";
            appendMessage("Bien joué, tu m'as battu aux échecs.", 'ai');
        }
    }

    const dialogs = [

        { id: 2, ai: "Ah ouais ? Et tu aimes ça ?", options: [{ text: "Oui, c'est passionnant.", next: 4 }, { text: "Ça dépend des jours.", next: 5 }] },
        { id: 3, ai: "C'est cool ça, tu étudies quoi ?", options: [{ text: "De l'économie.", next: 6 }, { text: "Des sciences.", next: 7 }] },
        { id: 4, ai: "Le code c'est vaste. Tu fais quoi comme langage ?", options: [{ text: "Du JavaScript principalement.", next: 8 }, { text: "Du Python et du C++.", next: 9 }] },
        { id: 5, ai: "Je vois... Le train-train quotidien quoi.", options: [{ text: "Exactement, un peu répétitif.", next: 10 }, { text: "Non, ça bouge souvent.", next: 11 }] },
        { id: 6, ai: "L'économie, c'est basé sur des chiffres. Tu aimes calculer ?", options: [{ text: "Oui, j'aime bien optimiser.", next: 12 }, { text: "Pas trop, c'est abstrait.", next: 13 }] },
        { id: 7, ai: "La science expérimentale, j'aime bien l'idée de tester des choses.", options: [{ text: "Moi aussi, voir comment ça réagit.", next: 14 }, { text: "C'est surtout beaucoup de théorie.", next: 15 }] },
        { id: 8, ai: "Le web, c'est vivant. Tu fais du front ou du back ?", options: [{ text: "Je fais un peu des deux (fullstack).", next: 16 }, { text: "Surtout du front-end.", next: 17 }] },
        { id: 9, ai: "Le C++, c'est puissant pour gérer la mémoire.", options: [{ text: "Oui, il faut faire attention aux fuites.", next: 18 }, { text: "C'est complexe mais efficace.", next: 19 }] },
        { id: 10, ai: "La monotonie, c'est ce qui fatigue le plus l'esprit.", options: [{ text: "Tu as totalement raison.", next: 20 }, { text: "Ça dépend comment on l'aborde.", next: 21 }] },
        { id: 11, ai: "Tu as des loisirs en dehors de ça ?", options: [{ text: "Je fais du sport et des jeux.", next: 22 }, { text: "J'écoute pas mal de musique.", next: 23 }] },
        { id: 12, ai: "Optimiser... parfois on supprime des éléments superflus.", options: [{ text: "Comme vider un cache.", next: 24 }, { text: "Ou épurer un code source.", next: 25 }] },

        { id: 42, ai: "Tu as des projets pour cette année ?", options: [{ text: "Oui, plein de choses à accomplir.", next: 33 }, { text: "Voir venir au jour le jour.", next: 34 }] },
        { id: 43, ai: "Vivre au jour le jour a son charme.", options: [{ text: "Moins de stress pour l'avenir.", next: 35 }, { text: "C'est parfois risqué.", next: 36 }] },
        { id: 44, ai: "Le risque fait partie du jeu.", options: [{ text: "Sans risque, pas de victoire.", next: 37 }, { text: "Je préfère assurer mes arrières.", next: 38 }] },
        { id: 45, ai: "On continue de devaser tranquillement.", options: [{ text: "C'est une conversation agréable.", next: 39 }, { text: "Tu as une de ces questions...", next: 40 }] },
        { id: 46, ai: "Bientôt la fin de notre parcours de discussion.", options: [{ text: "C'était intéressant.", next: 41 }, { text: "J'attends le point culminant.", next: 42 }] },
        { id: 47, ai: "Plus que quelques étapes.", options: [{ text: "Je suis prêt.", next: 43 }, { text: "Allons-y.", next: 44 }] },
        { id: 48, ai: "Le système réagit à nos interactions.", options: [{ text: "Je le remarque bien.", next: 45 }, { text: "Ça se ressent dans l'affichage.", next: 46 }] },
        { id: 49, ai: "Dernière ligne droite dans le dialogue, plus qu'un effort !", options: [{ text: "C'était un échange sympa.", next: 50 }, { text: "Activer la dernière phase.", next: 50 }] },
        { id: 50, ai: "Tous les dialogues sont complétés. L'IA panique et s'enfuit !", options: [{ text: "Lancer la poursuite finale.", next: 0 }] }
    ];

    let currentDialogId = 1;
    let chatMessages = document.getElementById('chatMessages');
    let dialogButtonsContainer = document.getElementById('dialogButtonsContainer');

    function renderDialogOptions() {
        dialogButtonsContainer.innerHTML = '';
        if (gameEnded || knifeModeActive) return;

        let currentStage = dialogs.find(d => d.id === currentDialogId) || dialogs[0];

        currentStage.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'dialog-btn';
            btn.innerText = opt.text;
            btn.addEventListener('click', () => {
                initAudio();
                playMessageSound();
                appendMessage(opt.text, 'user');

                dialogCount++; // Incrémentation exacte de chaque dialogue validé

                currentDialogId = opt.next;
                let nextStage = dialogs.find(d => d.id === currentDialogId) || dialogs[0];

                setTimeout(() => {
                    playMessageSound();
                    appendMessage(nextStage.ai + ` (Dialogues : ${dialogCount}/50)`, 'ai');

                    // Déclenchement exact à 50 dialogues
                    if (dialogCount >= 50 && !knifeModeActive) {
                        setTimeout(triggerKnifeMode, 1000);
                    } else {
                        renderDialogOptions();
                    }
                }, 400);
            });
            dialogButtonsContainer.appendChild(btn);
        });
    }

    function appendMessage(text, sender) {
        let div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // --- MODE PION FUYANT : C'EST MAINTENANT L'IA QUI FUIT ET LE JOUEUR QUI DOIT L'ATTRAPER ---
    let playerPawnMinigame = { x: 150, y: 150, speed: 3.5, size: 14 }; // Le joueur (Blanc)
    let enemyFleeingPawn = { x: 300, y: 300, speed: 2.2, size: 16 };     // L'IA fuyarde (Vert)
    let keysPressed = {};
    let knifeInterval = null;

    function triggerKnifeMode() {
        knifeModeActive = true;
        gameEnded = true;
        document.getElementById('board').style.display = 'none';
        let canvas = document.getElementById('knife-canvas');
        canvas.style.display = 'block';
        infoPanel.innerText = ">> PROTOCOLE FUITE : ATTRAPE LE PION DE L'IA <<";
        
        document.getElementById('mainContainer').classList.add('glitch-anim');
        appendMessage("L'IA panique, abandonne l'échiquier et prend la fuite ! Cours après son pion !", 'ai');

        window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

        knifeInterval = requestAnimationFrame(updatePawnChaseGame);
    }

    function updatePawnChaseGame() {
        if (!knifeModeActive) return;
        let canvas = document.getElementById('knife-canvas');
        let ctx = canvas.getContext('2d');

        // Déplacement du joueur (Blancs)
        if (keysPressed['arrowup'] || keysPressed['z']) playerPawnMinigame.y -= playerPawnMinigame.speed;
        if (keysPressed['arrowdown'] || keysPressed['s']) playerPawnMinigame.y += playerPawnMinigame.speed;
        if (keysPressed['arrowleft'] || keysPressed['q']) playerPawnMinigame.x -= playerPawnMinigame.speed;
        if (keysPressed['arrowright'] || keysPressed['d']) playerPawnMinigame.x += playerPawnMinigame.speed;

        playerPawnMinigame.x = Math.max(20, Math.min(canvas.width - 20, playerPawnMinigame.x));
        playerPawnMinigame.y = Math.max(20, Math.min(canvas.height - 20, playerPawnMinigame.y));

        // L'IA (Vert) s'enfuit en fuyant activement le joueur
        let dx = enemyFleeingPawn.x - playerPawnMinigame.x;
        let dy = enemyFleeingPawn.y - playerPawnMinigame.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 300) {
            let angle = Math.atan2(dy, dx);
            enemyFleeingPawn.x += Math.cos(angle) * enemyFleeingPawn.speed;
            enemyFleeingPawn.y += Math.sin(angle) * enemyFleeingPawn.speed;

            enemyFleeingPawn.x = Math.max(20, Math.min(canvas.width - 20, enemyFleeingPawn.x));
            enemyFleeingPawn.y = Math.max(20, Math.min(canvas.height - 20, enemyFleeingPawn.y));
        }

        // Condition de victoire : le joueur attrape le pion fuyant de l'IA
        if (dist < 20) {
            winPawnChaseGame();
            return;
        }

        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dessin du pion fuyant de l'IA (en vert)
        ctx.fillStyle = '#00FF66';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♟', enemyFleeingPawn.x, enemyFleeingPawn.y);

        // Dessin du pion du joueur (en blanc)
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('♙', playerPawnMinigame.x, playerPawnMinigame.y);

        knifeInterval = requestAnimationFrame(updatePawnChaseGame);
    }

    function winPawnChaseGame() {
        knifeModeActive = false;
        cancelAnimationFrame(knifeInterval);
        document.getElementById('knife-canvas').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('glitch-anim');
        infoPanel.innerText = ">> PION DE L'IA CAPTURÉ // VICTOIRE TOTALE <<";
        appendMessage("Félicitations, tu as rattrapé et neutralisé le pion fuyant de l'IA !", 'ai');
    }

    renderBoard();
    renderDialogOptions();
</script>
