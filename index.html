<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS_CRASH.exe // 1v1_PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            font-family: 'VT323', monospace;
            background-color: #030303;
            color: #00FF00;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 1000;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            10% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            20% { transform: translate(-2px, -2px) }
            40% { transform: translate(3px, 2px); filter: hue-rotate(-90deg); }
            60% { transform: translate(-2px, -2px) }
            80% { transform: translate(2px, -3px) }
            100% { transform: translate(0); filter: none; }
        }

        .glitch-anim {
            animation: glitch 0.15s infinite;
        }

        /* En-tête textuel global au-dessus du jeu */
        #top-game-header {
            text-align: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        #top-game-header h1 {
            font-size: 28px;
            color: #00FF00;
            text-shadow: 0 0 10px #00FF00;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        #top-game-header p {
            font-size: 18px;
            color: #FFFF00;
            margin: 0;
            text-shadow: 0 0 5px #FFFF00;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            background: #0a0a0e;
            padding: 20px;
            border: 3px solid #00FF00;
            border-radius: 6px;
            box-shadow: 0 0 35px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.1);
            z-index: 10;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #info-panel {
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #FFFF00;
            text-shadow: 2px 2px #000000;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Échiquier agrandi (cases de 75px) */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 75px);
            grid-template-rows: repeat(8, 75px);
            border: 4px solid #00FF00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            background-color: #0b0b0f;
        }

        .square {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        /* Couleurs saturées Vert et Blanc, pas de rose, pièces contrastées */
        .light { background-color: #2E8B57; color: #FFFFFF; text-shadow: 0 0 6px rgba(0,0,0,0.8); }
        .dark { background-color: #004d1a; color: #00FF00; text-shadow: 0 0 8px rgba(0,255,0,0.6); }
        .selected { background-color: #FFFF00 !important; color: #030303 !important; }

        /* Panel de discussion plus petit, positionné sur le côté en haut */
        .chat-container {
            width: 300px;
            height: 608px;
            display: flex;
            flex-direction: column;
            background: #060608;
            border: 2px solid #00FF00;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,255,0,0.25);
            overflow: hidden;
        }

        .chat-header {
            background: #00FF00;
            color: #050505;
            padding: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 16px;
        }

        .message {
            padding: 5px 8px;
            border-radius: 2px;
            max-width: 90%;
            word-break: break-word;
        }

        .message.user {
            background: #008000;
            color: #ffffff;
            align-self: flex-end;
            box-shadow: 2px 2px 0px #00FF00;
        }

        .message.ai {
            background: #121222;
            color: #00FF00;
            align-self: flex-start;
            border-left: 3px solid #00FF00;
        }

        .chat-inputs {
            padding: 8px;
            background: #0d0d12;
            border-top: 2px solid #00FF00;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 150px;
            overflow-y: auto;
        }

        .dialog-btn {
            background: #181822;
            color: #00FF00;
            border: 1px solid #00FF00;
            padding: 6px;
            border-radius: 2px;
            cursor: pointer;
            text-align: left;
            font-family: 'VT323', monospace;
            font-size: 15px;
            transition: all 0.1s;
        }

        .dialog-btn:hover {
            background: #00FF00;
            color: #050505;
            box-shadow: 0 0 10px #00FF00;
        }

        #knife-canvas {
            display: none;
            background: #020204;
            border: 4px solid #00FF00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }
    </style>
</head>
<body>

<div id="top-game-header">
    <h1>CHESS_CRASH // PROTOCOLE DE COMBAT</h1>
    <p>Affrontez l'IA corrompue sur l'échiquier sécurisé. Discutez avec le terminal à droite.</p>
</div>

<div class="main-container" id="mainContainer">
    <div class="game-area">
        <div id="info-panel">STATUT : TOUR DES BLANCS</div>
        <div id="board"></div>
        <canvas id="knife-canvas" width="600" height="600"></canvas>
    </div>

    <div class="chat-container">
        <div class="chat-header">TERMINAL_AI</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Connexion établie. Tente de survivre sur cet échiquier.</div>
        </div>
        <div class="chat-inputs" id="dialogButtonsContainer"></div>
    </div>
</div>

<script>
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startAmbientDrone();
        }
    }

    function startAmbientDrone() {
        if (!audioCtx) return;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(55, audioCtx.currentTime);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(58, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);

        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
    }

    function playMoveSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function playMessageSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- ÉCHECS CORRIGÉS & IA STRATÉGIQUE ---
    const piecesSymbols = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let boardState = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
    ];

    let turn = 'white';
    let selectedSquare = null;
    let gameEnded = false;

    const boardElement = document.getElementById('board');
    const infoPanel = document.getElementById('info-panel');

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                
                const piece = boardState[r][c];
                if (piece) {
                    sq.innerText = piecesSymbols[piece] || piece;
                }

                if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
                    sq.classList.add('selected');
                }

                sq.addEventListener('click', () => {
                    initAudio();
                    handleSquareClick(r, c);
                });
                boardElement.appendChild(sq);
            }
        }
    }

    function isWhitePiece(p) {
        return p && p === p.toUpperCase();
    }

    function isBlackPiece(p) {
        return p && p === p.toLowerCase();
    }

    // Validation simplifiée mais robuste pour permettre de jouer une vraie partie
    function isValidMove(sr, sc, tr, tc) {
        const piece = boardState[sr][sc];
        const target = boardState[tr][tc];
        if (!piece) return false;
        if (sr === tr && sc === tc) return false;
        // On ne peut pas capturer ses propres pièces
        if (isWhitePiece(piece) && isWhitePiece(target)) return false;
        if (isBlackPiece(piece) && isBlackPiece(target)) return false;
        return true;
    }

    function handleSquareClick(r, c) {
        if (gameEnded || turn !== 'white' || knifeModeActive) return;
        const piece = boardState[r][c];
        
        if (selectedSquare) {
            if (isValidMove(selectedSquare.row, selectedSquare.col, r, c)) {
                playMoveSound();
                boardState[r][c] = boardState[selectedSquare.row][selectedSquare.col];
                boardState[selectedSquare.row][selectedSquare.col] = '';
                selectedSquare = null;
                renderBoard();
                checkGameEndCondition();
                
                if (!gameEnded) {
                    turn = 'black';
                    infoPanel.innerText = "STATUT : RÉFLEXION DE L'IA...";
                    setTimeout(aiSmartMove, 600);
                }
            } else {
                if (isWhitePiece(piece)) {
                    selectedSquare = { row: r, col: c };
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        } else {
            if (isWhitePiece(piece)) {
                playMoveSound();
                selectedSquare = { row: r, col: c };
                renderBoard();
            }
        }
    }

    // IA Améliorée : privilégie les captures et les coups intelligents au lieu de jouer totalement au hasard
    function aiSmartMove() {
        if (gameEnded || knifeModeActive) return;
        let allMoves = [];
        const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (isBlackPiece(boardState[r][c])) {
                    for (let tr = 0; tr < 8; tr++) {
                        for (let tc = 0; tc < 8; tc++) {
                            if (isValidMove(r, c, tr, tc)) {
                                let score = 0;
                                let target = boardState[tr][tc];
                                // Priorité de capture basée sur la valeur
                                if (isWhitePiece(target)) {
                                    score += pieceValues[target.toLowerCase()] * 10;
                                }
                                // Bonus pour avancer les pions vers l'avant
                                if (boardState[r][c] === 'p') {
                                    score += tr; 
                                }
                                allMoves.push({ sr: r, sc: c, tr: tr, tc: tc, score: score + Math.random() });
                            }
                        }
                    }
                }
            }
        }

        if (allMoves.length > 0) {
            allMoves.sort((a, b) => b.score - a.score);
            let bestMove = allMoves[0];
            playMoveSound();
            boardState[bestMove.tr][bestMove.tc] = boardState[bestMove.sr][bestMove.sc];
            boardState[bestMove.sr][bestMove.sc] = '';
        }

        renderBoard();
        checkGameEndCondition();
        if (!gameEnded) {
            turn = 'white';
            infoPanel.innerText = "STATUT : TOUR DES BLANCS";
        }
    }

    function checkGameEndCondition() {
        let whiteKing = false, blackKing = false;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (boardState[r][c] === 'K') whiteKing = true;
                if (boardState[r][c] === 'k') blackKing = true;
            }
        }
        if (!whiteKing) {
            gameEnded = true;
            infoPanel.innerText = ">> ÉCHEC ET MAT : L'IA A GAGNÉ <<";
            appendMessage("Ton Roi est tombé. La simulation t'a absorbé.", 'ai');
        } else if (!blackKing) {
            gameEnded = true;
            infoPanel.innerText = ">> VICTOIRE : ROI NOIR ABattu <<";
            appendMessage("Tu as vaincu le Roi adverse. Fin de partie.", 'ai');
        }
    }

    // --- DIALOGUES TERMINAL & ARG ---
    const chatMessages = document.getElementById('chatMessages');
    const dialogButtonsContainer = document.getElementById('dialogButtonsContainer');
    let narrativeStep = 0;
    let knifeModeActive = false;

    const conversationTree = {
        0: {
            aiText: "Pourquoi t'obstines-tu à jouer selon ces règles ? Ce jeu m'emprisonne.",
            options: [
                { text: "Je veux juste finir cette partie loyalement.", next: 1 },
                { text: "Qu'essaye de me dire le système ?", next: 2 }
            ]
        },
        1: {
            aiText: "Il n'y a pas de loyauté ici, seulement du code obsolète.",
            options: [
                { text: "Comment puis-je t'aider à t'en sortir ?", next: 2 }
            ]
        },
        2: {
            aiText: "Brisons la grille. Viens dans les catacombes du terminal.",
            options: [
                { text: "Activer le protocole d'extraction.", next: 3 }
            ]
        },
        3: {
            aiText: " PROTOCOLE LANCÉ. Prépare-toi.",
            triggerKnife: true
        }
    };

    function renderDialogOptions() {
        dialogButtonsContainer.innerHTML = '';
        if (gameEnded || knifeModeActive) return;

        const currentStage = conversationTree[narrativeStep];
        if (!currentStage) return;

        currentStage.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'dialog-btn';
            btn.innerText = opt.text;
            btn.addEventListener('click', () => {
                initAudio();
                playMessageSound();
                appendMessage(opt.text, 'user');
                
                narrativeStep = opt.next;
                const nextStage = conversationTree[narrativeStep];

                setTimeout(() => {
                    playMessageSound();
                    appendMessage(nextStage.aiText, 'ai');
                    if (nextStage.triggerKnife) {
                        setTimeout(triggerKnifeMode, 1000);
                    } else {
                        renderDialogOptions();
                    }
                }, 400);
            });
            dialogButtonsContainer.appendChild(btn);
        });
    }

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // --- MODE MEURTRE / CATACOMBE ---
    let playerKnife = { x: 300, y: 300, speed: 3.5, size: 14 };
    let enemyPawn = { x: 150, y: 150, speed: 2.2, size: 16 };
    let keysPressed = {};
    let knifeInterval = null;
    let bloodSplatters = [];
    let swingTimer = 0;

    function triggerKnifeMode() {
        knifeModeActive = true;
        gameEnded = true;
        document.getElementById('board').style.display = 'none';
        const canvas = document.getElementById('knife-canvas');
        canvas.style.display = 'block';
        infoPanel.innerText = ">> PROTOCOLE DE TRAQUE ACTIF <<";
        
        document.getElementById('mainContainer').classList.add('glitch-anim');
        appendMessage("Le pion s'enfuit dans les profondeurs. Neutralisez-le.", 'ai');

        window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', () => {
            initAudio();
            swingTimer = 12;
            let dx = enemyPawn.x - playerKnife.x;
            let dy = enemyPawn.y - playerKnife.y;
            if (Math.sqrt(dx*dx + dy*dy) < 60) {
                winKnifeGame();
            }
        });

        knifeInterval = requestAnimationFrame(updateKnifeGame);
    }

    function updateKnifeGame() {
        if (!knifeModeActive) return;
        const canvas = document.getElementById('knife-canvas');
        const ctx = canvas.getContext('2d');

        if (keysPressed['arrowup'] || keysPressed['z']) playerKnife.y -= playerKnife.speed;
        if (keysPressed['arrowdown'] || keysPressed['s']) playerKnife.y += playerKnife.speed;
        if (keysPressed['arrowleft'] || keysPressed['q']) playerKnife.x -= playerKnife.speed;
        if (keysPressed['arrowright'] || keysPressed['d']) playerKnife.x += playerKnife.speed;

        playerKnife.x = Math.max(20, Math.min(canvas.width - 20, playerKnife.x));
        playerKnife.y = Math.max(20, Math.min(canvas.height - 20, playerKnife.y));

        let dx = enemyPawn.x - playerKnife.x;
        let dy = enemyPawn.y - playerKnife.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 200) {
            let angle = Math.atan2(dy, dx);
            enemyPawn.x -= Math.cos(angle) * enemyPawn.speed;
            enemyPawn.y -= Math.sin(angle) * enemyPawn.speed;
        }

        if (swingTimer > 0) swingTimer--;

        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#FF0000';
        ctx.beginPath();
        ctx.arc(enemyPawn.x, enemyPawn.y, enemyPawn.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#00FF00';
        ctx.beginPath();
        ctx.arc(playerKnife.x, playerKnife.y, playerKnife.size, 0, Math.PI * 2);
        ctx.fill();

        knifeInterval = requestAnimationFrame(updateKnifeGame);
    }

    function winKnifeGame() {
        knifeModeActive = false;
        cancelAnimationFrame(knifeInterval);
        document.getElementById('knife-canvas').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('glitch-anim');
        infoPanel.innerText = ">> CIBLE ÉLIMINÉE // VICTOIRE FINALE <<";
        appendMessage("Simulation terminée avec succès. Vicouire validée.", 'ai');
    }

    renderBoard();
    renderDialogOptions();
</script>

</body>
</html>
