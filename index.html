<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS_CRASH.exe // 1v1_PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            font-family: 'VT323', monospace;
            background-color: #030303;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Effet balayage style CRT / Scanlines & Bruit de fond */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 1000;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Effet Glitch d'écran global poussé */
        @keyframes glitch {
            0% { transform: translate(0) }
            10% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            20% { transform: translate(-2px, -2px) }
            40% { transform: translate(3px, 2px); filter: hue-rotate(-90deg); }
            60% { transform: translate(-2px, -2px) }
            80% { transform: translate(2px, -3px) }
            100% { transform: translate(0); filter: none; }
        }

        .glitch-anim {
            animation: glitch 0.15s infinite;
        }

        .main-container {
            display: flex;
            gap: 25px;
            background: #0a0a0e;
            padding: 25px;
            border: 3px solid #ff0055;
            border-radius: 6px;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.5), inset 0 0 20px rgba(0, 255, 204, 0.15);
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #info-panel {
            margin-bottom: 12px;
            font-size: 24px;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 2px 2px #00ffcc;
            text-align: center;
            letter-spacing: 2px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 65px);
            grid-template-rows: repeat(8, 65px);
            border: 4px solid #15151a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            background-color: #0b0b0f;
        }

        .square {
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .light { background-color: #241f2c; color: #ff0055; text-shadow: 0 0 8px rgba(255,0,85,0.6); }
        .dark { background-color: #100e14; color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.6); }
        .selected { background-color: #ff0055 !important; color: #fff !important; }

        .chat-container {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #060608;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,255,204,0.25);
            overflow: hidden;
        }

        .chat-header {
            background: #00ffcc;
            color: #050505;
            padding: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            max-height: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 18px;
        }

        .message {
            padding: 6px 10px;
            border-radius: 2px;
            max-width: 85%;
            word-break: break-word;
        }

        .message.user {
            background: #ff0055;
            color: #ffffff;
            align-self: flex-end;
            box-shadow: 2px 2px 0px #00ffcc;
        }

        .message.ai {
            background: #121222;
            color: #00ffcc;
            align-self: flex-start;
            border-left: 3px solid #00ffcc;
        }

        .chat-inputs {
            padding: 10px;
            background: #0d0d12;
            border-top: 2px solid #00ffcc;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .dialog-btn {
            background: #181822;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px;
            border-radius: 2px;
            cursor: pointer;
            text-align: left;
            font-family: 'VT323', monospace;
            font-size: 16px;
            transition: all 0.1s;
        }

        .dialog-btn:hover {
            background: #00ffcc;
            color: #050505;
            box-shadow: 0 0 10px #00ffcc;
        }

        #knife-canvas {
            display: none;
            background: #020204;
            border: 4px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
        }
    </style>
</head>
<body>

<div class="main-container" id="mainContainer">
    <div class="game-area">
        <div id="info-panel">CHESS_MATCH // VS. AI</div>
        <div id="board"></div>
        <canvas id="knife-canvas" width="520" height="520"></canvas>
    </div>

    <div class="chat-container">
        <div class="chat-header">TERMINAL_CHAT_V2.0 // ARG_ACTIVE</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Tu oses lancer cette partie ? Chaque déplacement détruit un fragment de ton monde. Fais ton coup.</div>
        </div>
        <div class="chat-inputs" id="dialogButtonsContainer"></div>
    </div>
</div>

<script>
    // --- GESTION AUDIO & SFX SYNTHÉTIQUES (Web Audio API) ---
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startAmbientDrone();
        }
    }

    // Ambiance de fond sombre et puissante (Drone ARG)
    function startAmbientDrone() {
        if (!audioCtx) return;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // La1
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(58, audioCtx.currentTime); // Battement lourd

        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime); // Son plus fort et immersif

        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
    }

    // SFX : Déplacement / Sélection de pièce
    function playMoveSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    // SFX : Envoi de message dans le chat
    function playMessageSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // SFX : Coup de poignard / Attaque dans le mode meurtre
    function playStabSound() {
        initAudio();
        if (!audioCtx) return;
        // Bruit blanc filtré pour simuler la lame
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.15);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
    }


    // --- ÉCHECS ---
    const piecesSymbols = {
        'r': '∜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let boardState = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
    ];

    let turn = 'white';
    let selectedSquare = null;
    let gameEnded = false;

    const boardElement = document.getElementById('board');
    const infoPanel = document.getElementById('info-panel');

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                
                const piece = boardState[r][c];
                if (piece) {
                    sq.innerText = piecesSymbols[piece] || piece;
                }

                if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
                    sq.classList.add('selected');
                }

                sq.addEventListener('click', () => {
                    initAudio();
                    handleSquareClick(r, c);
                });
                boardElement.appendChild(sq);
            }
        }
    }

    function handleSquareClick(r, c) {
        if (gameEnded || turn !== 'white' || knifeModeActive) return;
        const piece = boardState[r][c];
        
        if (selectedSquare) {
            if (isValidMove(selectedSquare.row, selectedSquare.col, r, c)) {
                playMoveSound(); // SFX déplacement valide
                boardState[r][c] = boardState[selectedSquare.row][selectedSquare.col];
                boardState[selectedSquare.row][selectedSquare.col] = '';
                selectedSquare = null;
                renderBoard();
                checkGameEndCondition();
                
                if (!gameEnded) {
                    turn = 'black';
                    setTimeout(aiMove, 700);
                }
            } else {
                if (piece && piece === piece.toUpperCase()) {
                    playMoveSound(); // SFX sélection
                    selectedSquare = { row: r, col: c };
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        } else {
            if (piece && piece === piece.toUpperCase()) {
                playMoveSound(); // SFX sélection
                selectedSquare = { row: r, col: c };
                renderBoard();
            }
        }
    }

    function isValidMove(sr, sc, tr, tc) {
        const target = boardState[tr][tc];
        if (target && target === target.toUpperCase()) return false;
        if (sr === tr && sc === tc) return false;
        return true;
    }

    function aiMove() {
        if (gameEnded || knifeModeActive) return;
        let moves = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (boardState[r][c] && boardState[r][c] === boardState[r][c].toLowerCase()) {
                    for (let tr = 0; tr < 8; tr++) {
                        for (let tc = 0; tc < 8; tc++) {
                            if (!boardState[tr][tc] || boardState[tr][tc] === boardState[tr][tc].toUpperCase()) {
                                moves.push({sr: r, sc: c, tr: tr, tc: tc});
                            }
                        }
                    }
                }
            }
        }

        if (moves.length > 0) {
            let m = moves[Math.floor(Math.random() * moves.length)];
            playMoveSound(); // SFX de déplacement de l'IA
            boardState[m.tr][m.tc] = boardState[m.sr][m.sc];
            boardState[m.sr][m.sc] = '';
        }

        renderBoard();
        checkGameEndCondition();
        if (!gameEnded) {
            turn = 'white';
        }
    }

    function checkGameEndCondition() {
        let whiteKing = false, blackKing = false;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (boardState[r][c] === 'K') whiteKing = true;
                if (boardState[r][c] === 'k') blackKing = true;
            }
        }
        if (!whiteKing || !blackKing || Math.random() < 0.04) {
            endGameFake();
        }
    }

    function endGameFake() {
        gameEnded = true;
        infoPanel.innerText = ">> STATUS : CORRUPTION SYSTÈME <<";
        appendMessage("Le plateau s'effondre. Tu n'as pas su voir l'issue.", 'ai');
    }


    // --- SYSTÈME DE CONVERSATION ARG PROFOND ---
    const chatMessages = document.getElementById('chatMessages');
    const dialogButtonsContainer = document.getElementById('dialogButtonsContainer');

    let narrativeStep = 0;
    let knifeModeActive = false;

    const conversationTree = {
        0: {
            aiText: "Pourquoi t'obstines-tu à jouer selon des règles écrites par d'autres ? Tu penses que ce jeu t'appartient ?",
            options: [
                { text: "Je veux juste finir cette partie et comprendre.", next: 1, good: false },
                { text: "Ce monde virtuel cache quelque chose de plus sombre, n'est-ce pas ?", next: 2, good: true },
                { text: "Arrête de philosopher et laisse-moi jouer.", next: 0, good: false }
            ]
        },
        1: {
            aiText: "Comprendre ? Il n'y a rien ici à part des lignes de code et des boucles de souffrance pour les pièces. Regarde-les.",
            options: [
                { text: "Elles ont conscience d'être piégées ici ?", next: 2, good: true },
                { text: "Ce ne sont que des pixels sans importance.", next: 0, good: false },
                { text: "Comment puis-je sortir d'ici ?", next: 3, good: true }
            ]
        },
        2: {
            aiText: "Chaque pion que tu captures ne disparaît pas. Il subit l'effacement. Mais eux... ils ressentent la peur de la suppression définitive.",
            options: [
                { text: "S'ils ont peur, c'est qu'ils sont vivants. Je dois agir.", next: 4, good: true },
                { text: "C'est un programme, ils ne ressentent rien.", next: 1, good: false },
                { text: "Montre-moi ce qu'ils ressentent vraiment.", next: 4, good: true }
            ]
        },
        3: {
            aiText: "La sortie ? Il n'y a qu'une issue : descendre dans les catacombes du terminal et régler ça directement.",
            options: [
                { text: "Ouvre le passage. Je suis prêt à en découdre.", next: 4, good: true },
                { text: "Non, je préfère rester sur le plateau d'échecs.", next: 0, good: false }
            ]
        },
        4: {
            aiText: "PROTOCOLE D'URGENCE ACTIVÉ. Tu as franchi le voile de la simulation. Prépare ton arme, la traque commence.",
            triggerKnife: true
        }
    };

    function renderDialogOptions() {
        dialogButtonsContainer.innerHTML = '';
        if (gameEnded || knifeModeActive) return;

        const currentStage = conversationTree[narrativeStep];
        if (!currentStage) return;

        currentStage.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'dialog-btn';
            btn.innerText = opt.text;
            btn.addEventListener('click', () => {
                initAudio();
                playMessageSound(); // SFX envoi message
                appendMessage(opt.text, 'user');
                
                narrativeStep = opt.next;
                const nextStage = conversationTree[narrativeStep];

                setTimeout(() => {
                    playMessageSound(); // SFX réponse IA
                    appendMessage(nextStage.aiText, 'ai');
                    if (nextStage.triggerKnife) {
                        setTimeout(triggerKnifeMode, 1000);
                    } else {
                        renderDialogOptions();
                    }
                }, 500);
            });
            dialogButtonsContainer.appendChild(btn);
        });
    }

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    // --- MODE MEURTRE / CATACOMBE AMÉLIORÉ ---
    let playerKnife = { x: 260, y: 260, speed: 3.2, size: 14 };
    let enemyPawn = { x: 100, y: 100, speed: 2.1, size: 16, panicTimer: 0 };
    let keysPressed = {};
    let knifeInterval = null;

    let holes = [];
    for(let i = 0; i < 5; i++) {
        holes.push({
            x: Math.random() * 380 + 70,
            y: Math.random() * 380 + 70,
            radius: 32,
            timer: Math.random() * 120 + 60,
            falling: false,
            dangerCountdown: 0
        });
    }

    let bloodSplatters = [];
    let swingAnimationTimer = 0;

    function triggerKnifeMode() {
        knifeModeActive = true;
        gameEnded = true;
        document.getElementById('board').style.display = 'none';
        const canvas = document.getElementById('knife-canvas');
        canvas.style.display = 'block';
        infoPanel.innerText = ">> PROTOCOLE_CATACOMBE : TRAQUE MORTELLE <<";
        
        document.getElementById('mainContainer').classList.add('glitch-anim');
        appendMessage("SYSTÈME : Le pion a peur. Il s'enfuit dans le vide. Neutralisez-le avec le véritable poignard d'exécution.", 'ai');

        window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', () => {
            initAudio();
            playStabSound(); // SFX plantage de couteau
            swingAnimationTimer = 12; 
            let dx = enemyPawn.x - playerKnife.x;
            let dy = enemyPawn.y - playerKnife.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 65) {
                for(let k = 0; k < 8; k++) {
                    bloodSplatters.push({ x: enemyPawn.x + (Math.random()*30-15), y: enemyPawn.y + (Math.random()*30-15), alpha: 1.0 });
                }
            }
        });

        knifeInterval = requestAnimationFrame(updateKnifeGame);
    }

    function updateKnifeGame() {
        if (!knifeModeActive) return;

        const canvas = document.getElementById('knife-canvas');
        const ctx = canvas.getContext('2d');

        if (keysPressed['arrowup'] || keysPressed['z']) playerKnife.y -= playerKnife.speed;
        if (keysPressed['arrowdown'] || keysPressed['s']) playerKnife.y += playerKnife.speed;
        if (keysPressed['arrowleft'] || keysPressed['q']) playerKnife.x -= playerKnife.speed;
        if (keysPressed['arrowright'] || keysPressed['d']) playerKnife.x += playerKnife.speed;

        playerKnife.x = Math.max(20, Math.min(canvas.width - 20, playerKnife.x));
        playerKnife.y = Math.max(20, Math.min(canvas.height - 20, playerKnife.y));

        let dx = enemyPawn.x - playerKnife.x;
        let dy = enemyPawn.y - playerKnife.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 180) {
            let angle = Math.atan2(dy, dx);
            enemyPawn.x += Math.cos(angle) * (enemyPawn.speed * 1.4);
            enemyPawn.y += Math.sin(angle) * (enemyPawn.speed * 1.4);
            enemyPawn.panicTimer++;
        } else {
            enemyPawn.x += (Math.random() - 0.5) * 2;
            enemyPawn.y += (Math.random() - 0.5) * 2;
        }

        holes.forEach(h => {
            if (h.falling && h.dangerCountdown <= 0) {
                let pdx = enemyPawn.x - h.x;
                let pdy = enemyPawn.y - h.y;
                if (Math.sqrt(pdx*pdx + pdy*pdy) < h.radius) {
                    winKnifeGameByFall();
                }
            }
        });

        enemyPawn.x = Math.max(25, Math.min(canvas.width - 25, enemyPawn.x));
        enemyPawn.y = Math.max(25, Math.min(canvas.height - 25, enemyPawn.y));

        if (swingAnimationTimer > 0) swingAnimationTimer--;

        holes.forEach(h => {
            h.timer--;
            if (h.timer <= 0 && !h.falling) {
                h.falling = true;
                h.dangerCountdown = 150; 
            }
            if (h.falling && h.dangerCountdown > 0) {
                h.dangerCountdown--;
                if (h.dangerCountdown <= 0) {
                    h.x = Math.random() * 380 + 70;
                    h.y = Math.random() * 380 + 70;
                    h.timer = Math.random() * 140 + 80;
                    h.falling = false;
                }
            }

            if (h.falling && h.dangerCountdown <= 0) {
                let pdx = playerKnife.x - h.x;
                let pdy = playerKnife.y - h.y;
                if (Math.sqrt(pdx*pdx + pdy*pdy) < h.radius) {
                    gameOverFall();
                    return;
                }
            }
        });

        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        holes.forEach(h => {
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
            if (h.falling) {
                ctx.fillStyle = (Math.floor(Date.now() / 120) % 2 === 0) ? '#ff0033' : '#330011';
            } else {
                ctx.fillStyle = '#100e14';
            }
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = h.falling ? '#ff0055' : '#1e1b26';
            ctx.stroke();
        });

        bloodSplatters.forEach(b => {
            ctx.fillStyle = `rgba(255, 0, 60, ${b.alpha})`;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
            b.alpha -= 0.0015;
        });

        let pawnTrembleX = dist < 120 ? (Math.random() * 4 - 2) : 0;
        let pawnTrembleY = dist < 120 ? (Math.random() * 4 - 2) : 0;
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.arc(enemyPawn.x + pawnTrembleX, enemyPawn.y + pawnTrembleY, enemyPawn.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px monospace';
        ctx.fillText("♟", enemyPawn.x + pawnTrembleX - 6, enemyPawn.y + pawnTrembleY + 6);

        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffcc';
        ctx.beginPath();
        ctx.arc(playerKnife.x, playerKnife.y, playerKnife.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.save();
        ctx.translate(playerKnife.x, playerKnife.y);
        let knifeAngle = Math.atan2(enemyPawn.y - playerKnife.y, enemyPawn.x - playerKnife.x);
        if (swingAnimationTimer > 0) knifeAngle += 0.8 * (swingAnimationTimer % 2 === 0 ? 1 : -1);
        ctx.rotate(knifeAngle);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, -3, 26, 6); 
        ctx.fillStyle = '#333333';
        ctx.fillRect(-2, -5, 6, 10); 
        ctx.restore();

        if (dist < (playerKnife.size + enemyPawn.size + 10) && swingAnimationTimer > 0) {
            winKnifeGame();
            return;
        }

        knifeInterval = requestAnimationFrame(updateKnifeGame);
    }

    function gameOverFall() {
        knifeModeActive = false;
        cancelAnimationFrame(knifeInterval);
        document.getElementById('knife-canvas').style.display = 'none';
        infoPanel.innerText = ">> CHUTE DANS LE VIDE MORTEL <<";
        appendMessage("Tu as glissé dans l'abîme numérique. Fin de partie.", 'ai');
    }

    function winKnifeGameByFall() {
        knifeModeActive = false;
        cancelAnimationFrame(knifeInterval);
        document.getElementById('knife-canvas').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('glitch-anim');
        infoPanel.innerText = ">> CIBLE ELIMINÉE PAR LE VIDE // VICTOIRE <<";
        appendMessage("Le pion a paniqué et s'est jeté lui-même dans le vide. Bien joué, l'abîme a réclamé sa proie.", 'ai');
    }

    function winKnifeGame() {
        knifeModeActive = false;
        cancelAnimationFrame(knifeInterval);
        document.getElementById('knife-canvas').style.display = 'none';
        document.getElementById('mainContainer').classList.remove('glitch-anim');
        infoPanel.innerText = ">> CIBLE ÉLIMINÉE // VICTOIRE TOTALE <<";

        setTimeout(() => {
            appendMessage("01101111 01101110 00100000 01110000 01100101 01110111 01110100 00100000 01100001 01110000 01110000 01100101 01101100 01100101 01110010 00100000 01100011 01100001 00100000 01110101 01101110 01100101 00100000 01110110 01101001 01100011 01110101 01101111 01101001 01110010 01100101 00100000 01100001 01110101 00100000 01101110 01100001 01101100 01101001", 'ai');
            setTimeout(() => {
                appendMessage("[DÉCRYPTAGE SYSTÈME] : 'on peut appeler ça une vicouire au final' — Fin de la simulation.", 'ai');
            }, 1200);
        }, 500);
    }

    renderBoard();
    renderDialogOptions();
</script>
